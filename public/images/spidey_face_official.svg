<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Suit Shading Gradient -->
    <radialGradient id="headBaseGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF2A30"/>
      <stop offset="55%" stop-color="#E62429"/>
      <stop offset="85%" stop-color="#B30F13"/>
      <stop offset="100%" stop-color="#6B0003"/>
    </radialGradient>

    <!-- Glossy Eye Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F9FF"/>
      <stop offset="85%" stop-color="#BDE3FF"/>
      <stop offset="100%" stop-color="#70C4FF"/>
    </linearGradient>

    <!-- Lens Shadow -->
    <filter id="lensBevelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Outer Head Contour (Authentic Classic Spider-Man Mask) -->
  <path d="M250,20 
           C130,20 50,110 50,280 
           C50,440 140,550 250,565 
           C360,550 450,440 450,280 
           C450,110 370,20 250,20 Z" 
        fill="url(#headBaseGrad)" 
        stroke="#000000" 
        stroke-width="14" 
        stroke-linejoin="round"/>

  <!-- Crisp Fine Web Grid Lines -->
  <g stroke="#000000" stroke-width="5" opacity="0.55" fill="none" stroke-linecap="round">
    <!-- Radial Lines From Nose Center -->
    <line x1="250" y1="260" x2="250" y2="20"/>
    <line x1="250" y1="260" x2="250" y2="565"/>
    <line x1="250" y1="260" x2="50" y2="280"/>
    <line x1="250" y1="260" x2="450" y2="280"/>
    <line x1="250" y1="260" x2="100" y2="70"/>
    <line x1="250" y1="260" x2="400" y2="70"/>
    <line x1="250" y1="260" x2="110" y2="490"/>
    <line x1="250" y1="260" x2="390" y2="490"/>

    <!-- Concentric Web Arcs -->
    <path d="M190,190 Q250,150 310,190 Q345,260 310,330 Q250,370 190,330 Q155,260 190,190 Z"/>
    <path d="M130,130 Q250,80 370,130 Q415,260 370,390 Q250,440 130,390 Q85,260 130,130 Z"/>
    <path d="M80,70 Q250,25 420,70 Q455,260 420,450 Q250,510 80,450 Q45,260 80,70 Z"/>
  </g>

  <!-- Left Eye Bezel & Lens (Authentic Sleek Angular Spidey Shape) -->
  <g filter="url(#lensBevelShadow)">
    <!-- Heavy Outer Black Rim -->
    <path d="M85,225 
             C120,195 195,210 220,270 
             C225,320 185,355 125,340 
             C75,328 65,270 85,225 Z" 
          fill="#000000"/>
    <!-- Inner Luminous White/Blue Lens -->
    <path d="M98,235 
             C128,212 188,222 208,268 
             C212,305 178,336 128,324 
             C88,314 80,275 98,235 Z" 
          fill="url(#lensGrad)"/>
    <!-- Specular Highlight -->
    <ellipse cx="125" cy="265" rx="18" ry="34" fill="#FFFFFF" opacity="0.75" transform="rotate(-18 125 265)"/>
  </g>

  <!-- Right Eye Bezel & Lens (Mirror Angular Shape) -->
  <g filter="url(#lensBevelShadow)">
    <!-- Heavy Outer Black Rim -->
    <path d="M415,225 
             C380,195 305,210 280,270 
             C275,320 315,355 375,340 
             C425,328 435,270 415,225 Z" 
          fill="#000000"/>
    <!-- Inner Luminous White/Blue Lens -->
    <path d="M402,235 
             C372,212 312,222 292,268 
             C288,305 322,336 372,324 
             C412,314 420,275 402,235 Z" 
          fill="url(#lensGrad)"/>
    <!-- Specular Highlight -->
    <ellipse cx="375" cy="265" rx="18" ry="34" fill="#FFFFFF" opacity="0.75" transform="rotate(18 375 265)"/>
  </g>
</svg>
